services:
  moodle:
    image: moodlehq/moodle-php-apache:8.4
    container_name: moodle
    depends_on:
      - moodle_database
    links:
      - moodle_database
    ports: 
      - 8080:80
    environment:
      MOODLE_DB_TYPE: pgsql
      MOODLE_DB_HOST: moodle_database
      MOODLE_DB_NAME: moodle
      MOODLE_DB_USER: moodleuser
      MOODLE_DB_PASS: password
      MOODLE_DB_PORT: 5432
    volumes:
      - ./moodle_data:/var/www/html
      - ./assets:/var/www/assets
    networks:
      - moodle-net

  moodle_database:
    container_name: moodle_database
    image: postgres:18-alpine
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: moodle
      POSTGRES_USER: moodleuser
      POSTGRES_PASSWORD: password
    networks:
      - moodle-net

networks:
  moodle-net:
